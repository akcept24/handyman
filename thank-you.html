<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You — California Handyman</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="tracking.config.js"></script>
    <script src="tracking.loader.js"></script>
    <style>
        .thank-you-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
            padding: 2rem;
        }
        .thank-you-card {
            background: #fff;
            border-radius: 20px;
            padding: 3rem 2.5rem;
            max-width: 520px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.3);
        }
        .thank-you-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #28A745, #20c997);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            color: #fff;
            font-size: 2.5rem;
        }
        .thank-you-card h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        .thank-you-card p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <div class="thank-you-page">
        <div class="thank-you-card">
            <div class="thank-you-icon"><i class="fas fa-check"></i></div>
            <h1>Thank You!</h1>
            <p>We received your request and will contact you within <strong>1 hour</strong>. For urgent repairs, call us directly.</p>
            <a href="/" class="btn btn-primary btn-large">Back to Home</a>
            <p style="margin-top:1.5rem;font-size:0.9rem;">
                <a href="tel:+18888888888"><i class="fas fa-phone"></i> (888) 888-8888</a>
            </p>
        </div>
    </div>
    <script>
        window.addEventListener('load', function() {
            if (typeof trackConversion === 'function') {
                trackConversion('thank_you_page', { source: 'redirect' });
            }
        });
    </script>
    <script src="script.js"></script>
</body>
</html>
